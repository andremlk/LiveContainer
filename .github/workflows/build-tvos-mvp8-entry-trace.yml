name: MVP8F Thread-Scoped Dyld NoLock

on:
  workflow_dispatch:
  push:
    branches: [tvos-mvp8-entry-trace]
    paths:
      - 'tvOS/ProbeMVP0/AppHost/MVP7HMain.m'
      - 'tvOS/ProbeMVP0/AppHost/MVP8Main.m'
      - 'tvOS/ProbeMVP0/AppHost/MVP8DyldNoLock.h'
      - 'tvOS/ProbeMVP0/AppHost/MVP8DyldNoLock.m'
      - 'tvOS/ProbeMVP0/AppHost/MVP8Trace.h'
      - 'tvOS/ProbeMVP0/AppHost/MVP8Trace.m'
      - 'tvOS/ProbeMVP0/AppHost/GuestRuntime.h'
      - 'tvOS/ProbeMVP0/AppHost/GuestRuntime.m'
      - 'tvOS/ProbeMVP0/AppHost/Info.plist'
      - 'tvOS/ProbeMVP0/project-mvp8.yml'
      - '.github/workflows/build-tvos-mvp8-entry-trace.yml'

concurrency:
  group: tvos-mvp8-entry-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-host-template:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate standalone MVP8 project
        working-directory: tvOS/ProbeMVP0
        run: |
          set -euo pipefail
          xcodegen generate --spec project-mvp8.yml

      - name: Build unsigned tvOS host
        working-directory: tvOS/ProbeMVP0
        run: |
          set -euo pipefail
          rm -rf build-mvp8 out-mvp8
          mkdir -p out-mvp8
          xcodebuild \
            -project LiveContainerTVMVP8.xcodeproj \
            -scheme LiveContainerTVMVP8 \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build-mvp8 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee out-mvp8/xcodebuild.log

      - name: Verify MVP8F no-lock binary
        working-directory: tvOS/ProbeMVP0
        run: |
          set -euo pipefail
          APP='build-mvp8/Build/Products/Release-appletvos/LiveContainerTV.app'
          BIN="$APP/LiveContainerTV"
          test -d "$APP"
          test -f "$BIN"
          file "$BIN"
          lipo -info "$BIN" | tee out-mvp8/lipo.txt
          nm "$BIN" | grep -E 'LCTVMVP8TraceEvent|LCTVMVP7HOriginalMain|LCTVMVP8Dlopen|LCTVMVP8FDlopenNoLock|litehook_find_dsc_symbol' | tee out-mvp8/trace-symbols.txt
          grep -F 'MVP8F_NOLOCK_BEGIN' AppHost/MVP8Main.m
          grep -F 'MVP8F_NOLOCK_RESTORED' AppHost/MVP8Main.m
          grep -F 'MVP8F_NOLOCK_ERROR' AppHost/MVP8Main.m
          grep -F 'LCTVMVP8FLockHook' AppHost/MVP8DyldNoLock.m
          grep -F 'LCTVMVP8FUnlockHook' AppHost/MVP8DyldNoLock.m
          grep -F 'RTLD_LAZY | RTLD_GLOBAL | RTLD_FIRST' AppHost/MVP8Main.m
          grep -F 'DLOPEN_RETURN' AppHost/MVP8Main.m
          grep -F 'LEGACY_STAGE:' AppHost/MVP8Trace.m
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | tee out-mvp8/bundle-id.txt
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" | tee out-mvp8/executable.txt

      - name: Package MVP8F host template IPA
        working-directory: tvOS/ProbeMVP0
        run: |
          set -euo pipefail
          APP='build-mvp8/Build/Products/Release-appletvos/LiveContainerTV.app'
          PKG='out-mvp8/package/Payload'
          rm -rf out-mvp8/package
          mkdir -p "$PKG"
          cp -R "$APP" "$PKG/"
          (cd out-mvp8/package && zip -qry ../LiveContainerTV-MVP8F-DyldNoLock.ipa Payload)
          shasum -a 256 out-mvp8/LiveContainerTV-MVP8F-DyldNoLock.ipa | tee out-mvp8/SHA256.txt

      - name: Upload MVP8F host IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainerTV-MVP8F-DyldNoLock
          path: |
            tvOS/ProbeMVP0/out-mvp8/LiveContainerTV-MVP8F-DyldNoLock.ipa
            tvOS/ProbeMVP0/out-mvp8/SHA256.txt
            tvOS/ProbeMVP0/out-mvp8/xcodebuild.log
            tvOS/ProbeMVP0/out-mvp8/trace-symbols.txt
          if-no-files-found: error
