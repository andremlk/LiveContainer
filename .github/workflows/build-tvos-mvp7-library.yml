name: MVP7 Dynamic tvOS Guest Library

on:
  workflow_dispatch:
  push:
    branches: [tvos-mvp0]
    paths:
      - 'tvOS/ProbeMVP0/AppHost/MVP7Main.m'
      - 'tvOS/ProbeMVP0/AppHost/GuestRuntime.h'
      - 'tvOS/ProbeMVP0/AppHost/GuestRuntime.m'
      - 'tvOS/ProbeMVP0/Tools/**'
      - 'tvOS/ProbeMVP0/project.yml'
      - '.github/workflows/build-tvos-mvp7-library.yml'

concurrency:
  group: tvos-mvp7-library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dynamic-library:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build LiveContainerTV Mach-O patcher
        working-directory: tvOS/ProbeMVP0
        run: |
          set -euo pipefail
          mkdir -p build-tools out
          xcrun clang -std=c11 -Wall -Wextra -Werror \
            Tools/lctv_macho_patch.c \
            -o build-tools/lctv_macho_patch

      - name: Build known-good Sample Guide IPA
        run: |
          set -euo pipefail
          rm -rf /tmp/lctv-mvp7-sample
          git clone --quiet https://github.com/abdulkarimkhaan/tvOS-sample-guide.git /tmp/lctv-mvp7-sample
          cd /tmp/lctv-mvp7-sample
          git checkout --quiet e1a672c59e2d3045542e351d326aa7642c4fa895

          OUT="$GITHUB_WORKSPACE/tvOS/ProbeMVP0/out"
          xcodebuild \
            -project tvOS-Sample-Guide.xcodeproj \
            -scheme tvOS-Sample-Guide \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "$OUT/mvp7-sample-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$OUT/mvp7-sample-xcodebuild.log"

          PRODUCTS="$OUT/mvp7-sample-derived/Build/Products/Release-appletvos"
          APP="$(find "$PRODUCTS" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP"
          rm -rf "$OUT/mvp7-sample-ipa"
          mkdir -p "$OUT/mvp7-sample-ipa/Payload"
          cp -R "$APP" "$OUT/mvp7-sample-ipa/Payload/"
          (cd "$OUT/mvp7-sample-ipa" && zip -qry ../MVP7-Sample-Guide.ipa Payload)
          test -f "$OUT/MVP7-Sample-Guide.ipa"

      - name: Download pinned NuvioTV unsigned IPA
        working-directory: tvOS/ProbeMVP0
        run: |
          set -euo pipefail
          NUVIO='out/NuvioTV-3.3.3-unsigned-release.ipa'
          curl -fL --retry 3 --retry-delay 2 \
            -o "$NUVIO" \
            'https://github.com/bobsupra/NuvioTVOS/releases/download/tvos-beta-3.3.3/NuvioTV-3.3.3-unsigned-release.ipa'
          echo '80d6f9b4fbd29b20bdbea71e493a782c9bd1a38ca5541a11940666054118eee1  out/NuvioTV-3.3.3-unsigned-release.ipa' | shasum -a 256 -c -

          mkdir -p out/nuvio-license
          curl -fL -o out/nuvio-license/LICENSE.txt \
            'https://raw.githubusercontent.com/bobsupra/NuvioTVOS/tvos-beta-3.3.3/LICENSE'
          printf '%s\n' \
            'NuvioTVOS source: https://github.com/bobsupra/NuvioTVOS/tree/tvos-beta-3.3.3' \
            'Binary source: upstream unsigned release tvos-beta-3.3.3' \
            > out/nuvio-license/SOURCE.txt

      - name: Analyze external guests
        working-directory: tvOS/ProbeMVP0
        run: |
          set -euo pipefail
          python3 Tools/lctv_ipa_analyze.py \
            out/MVP7-Sample-Guide.ipa \
            --json-out out/MVP7-Sample-analysis.json | tee out/MVP7-Sample-analysis.txt

          python3 Tools/lctv_ipa_analyze.py \
            out/NuvioTV-3.3.3-unsigned-release.ipa \
            --json-out out/MVP7-Nuvio-analysis.json | tee out/MVP7-Nuvio-analysis.txt

          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('Sample', 'Nuvio'):
              report = json.loads(Path(f'out/MVP7-{name}-analysis.json').read_text())
              assert report['compatible_for_mvp5'] is True, report
              assert report['macho']['arm64'] is True, report
              assert report['macho']['filetype_name'] == 'MH_EXECUTE', report
              assert report['macho']['lc_main'], report
              assert not report['macho']['encrypted'], report
              print(f'MVP7 ANALYZE PASS {name}:', report['app']['display_name'], report['app']['bundle_id'])
          PY

      - name: Prepare generic guest bundles
        working-directory: tvOS/ProbeMVP0
        run: |
          set -euo pipefail
          chmod +x Tools/lctv_prepare_ipa.sh

          LCTV_PATCHER="$PWD/build-tools/lctv_macho_patch" \
            bash Tools/lctv_prepare_ipa.sh \
              out/MVP7-Sample-Guide.ipa \
              out/mvp7-sample-prepared
          python3 Tools/lctv_wrap_guest_framework.py \
            out/mvp7-sample-prepared \
            out/ControlGuest.framework

          LCTV_PATCHER="$PWD/build-tools/lctv_macho_patch" \
            bash Tools/lctv_prepare_ipa.sh \
              out/NuvioTV-3.3.3-unsigned-release.ipa \
              out/mvp7-nuvio-prepared
          python3 Tools/lctv_wrap_guest_framework.py \
            out/mvp7-nuvio-prepared \
            out/MediaGuest.framework

          mkdir -p out/MediaGuest.framework/Licenses/NuvioTVOS
          cp out/nuvio-license/LICENSE.txt out/MediaGuest.framework/Licenses/NuvioTVOS/
          cp out/nuvio-license/SOURCE.txt out/MediaGuest.framework/Licenses/NuvioTVOS/

          test ! -d out/MediaGuest.framework/PlugIns

      - name: Build MVP7 dynamic-library host
        working-directory: tvOS/ProbeMVP0
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild \
            -project LiveContainerTV.xcodeproj \
            -scheme LiveContainerTVMVP7 \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build-mvp7-host \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee out/mvp7-host-xcodebuild.log

      - name: Prove MVP7 source has no app-specific catalog
        working-directory: tvOS/ProbeMVP0
        run: |
          set -euo pipefail
          ! grep -E 'MVP6SampleGuest|MVP6NuvioGuest|NuvioTV 3\.3\.3|tvOS Sample Guide \(control\)' AppHost/MVP7Main.m
          grep -q 'LCTVPreparedGuest' AppHost/MVP7Main.m
          grep -q 'contentsOfDirectoryAtURL' AppHost/MVP7Main.m
          echo 'MVP7 DYNAMIC CATALOG SOURCE PASS'

      - name: Stage prepared guests without catalog changes
        working-directory: tvOS/ProbeMVP0
        run: |
          set -euo pipefail
          HOST='build-mvp7-host/Build/Products/Release-appletvos/LiveContainerTV.app'
          test -d "$HOST"
          mkdir -p "$HOST/Frameworks"
          cp -R out/ControlGuest.framework "$HOST/Frameworks/ControlGuest.framework"
          cp -R out/MediaGuest.framework "$HOST/Frameworks/MediaGuest.framework"

          python3 - <<'PY' | tee out/MVP7-Catalog.txt
          import plistlib
          from pathlib import Path

          root = Path('build-mvp7-host/Build/Products/Release-appletvos/LiveContainerTV.app/Frameworks')
          guests = []
          for fw in sorted(root.glob('*.framework')):
              info_path = fw / 'Info.plist'
              if not info_path.is_file():
                  continue
              info = plistlib.loads(info_path.read_bytes())
              if not info.get('LCTVPreparedGuest'):
                  continue
              exe = info.get('CFBundleExecutable')
              assert exe and (fw / exe).is_file(), (fw, exe)
              guests.append((fw.name, info.get('CFBundleDisplayName') or info.get('CFBundleName'), info.get('CFBundleIdentifier')))

          assert len(guests) == 2, guests
          for fw, name, bundle_id in guests:
              print(f'{fw}\t{name}\t{bundle_id}')
          print(f'MVP7 DISCOVERY FIXTURE PASS: {len(guests)} prepared guests')
          PY

          for FW in ControlGuest MediaGuest; do
            INFO="$HOST/Frameworks/$FW.framework/Info.plist"
            EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")"
            python3 Tools/verify_macho.py "$HOST/Frameworks/$FW.framework/$EXEC"
          done

      - name: Package MVP7 dynamic-library IPA
        working-directory: tvOS/ProbeMVP0
        run: |
          set -euo pipefail
          HOST='build-mvp7-host/Build/Products/Release-appletvos/LiveContainerTV.app'
          rm -rf out/mvp7-host-ipa
          mkdir -p out/mvp7-host-ipa/Payload
          cp -R "$HOST" out/mvp7-host-ipa/Payload/
          (cd out/mvp7-host-ipa && zip -qry ../LiveContainerTV-MVP7-DynamicLibrary.ipa Payload)
          test -f out/LiveContainerTV-MVP7-DynamicLibrary.ipa
          shasum -a 256 out/LiveContainerTV-MVP7-DynamicLibrary.ipa | tee out/MVP7-IPA-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MVP7-Dynamic-Guest-Library
          path: |
            tvOS/ProbeMVP0/out/LiveContainerTV-MVP7-DynamicLibrary.ipa
            tvOS/ProbeMVP0/out/MVP7-IPA-SHA256.txt
            tvOS/ProbeMVP0/out/MVP7-Catalog.txt
            tvOS/ProbeMVP0/out/MVP7-Sample-analysis.json
            tvOS/ProbeMVP0/out/MVP7-Nuvio-analysis.json
            tvOS/ProbeMVP0/out/mvp7-host-xcodebuild.log
            tvOS/ProbeMVP0/out/nuvio-license/**
