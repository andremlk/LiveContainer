name: Build tvOS Prototype

on:
  workflow_dispatch:
  push:
    branches: [tvos-mvp0]
    paths:
      - 'tvOS/ProbeMVP0/**'
      - '.github/workflows/build-tvos-mvp0.yml'
  pull_request:
    paths:
      - 'tvOS/ProbeMVP0/**'
      - '.github/workflows/build-tvos-mvp0.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: tvOS/ProbeMVP0
        run: xcodegen generate

      - name: Build unsigned tvOS host
        working-directory: tvOS/ProbeMVP0
        run: |
          set -o pipefail
          xcodebuild \
            -project LiveContainerTV.xcodeproj \
            -scheme LiveContainerTV \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild.log

      - name: Verify embedded MVP0 payload
        working-directory: tvOS/ProbeMVP0
        run: |
          APP='build/Build/Products/Release-appletvos/LiveContainerTV.app'
          PAYLOAD="$APP/Frameworks/GuestPayload.framework/GuestPayload"
          test -d "$APP"
          test -f "$PAYLOAD"
          file "$APP/LiveContainerTV"
          file "$PAYLOAD"
          otool -hv "$PAYLOAD"
          otool -L "$APP/LiveContainerTV"

      - name: Build TinyGuestTV executable
        working-directory: tvOS/ProbeMVP0
        run: |
          set -o pipefail
          xcodebuild \
            -project LiveContainerTV.xcodeproj \
            -scheme TinyGuestTV \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build-guest \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild-guest.log

      - name: Build UIKitGuestTV executable
        working-directory: tvOS/ProbeMVP0
        run: |
          set -o pipefail
          xcodebuild \
            -project LiveContainerTV.xcodeproj \
            -scheme UIKitGuestTV \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build-uikit-guest \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild-uikit-guest.log

      - name: Build Mach-O patcher
        working-directory: tvOS/ProbeMVP0
        run: |
          mkdir -p build-tools
          xcrun clang -std=c11 -Wall -Wextra -Werror \
            Tools/lctv_macho_patch.c \
            -o build-tools/lctv_macho_patch

      - name: Patch and verify TinyGuestTV as MH_DYLIB
        working-directory: tvOS/ProbeMVP0
        run: |
          GUEST='build-guest/Build/Products/Release-appletvos/TinyGuestTV.app/TinyGuestTV'
          mkdir -p out
          cp "$GUEST" out/TinyGuestTV.original
          cp "$GUEST" out/TinyGuestTV.patched
          echo '--- TinyGuestTV before ---'
          otool -hv out/TinyGuestTV.original
          ./build-tools/lctv_macho_patch out/TinyGuestTV.patched
          echo '--- TinyGuestTV after ---'
          otool -hv out/TinyGuestTV.patched
          otool -l out/TinyGuestTV.patched | sed -n '1,140p'
          python3 Tools/verify_macho.py out/TinyGuestTV.patched
          nm -gU out/TinyGuestTV.patched | tee out/TinyGuestTV.symbols
          grep -q '_LCTVGuestMarker' out/TinyGuestTV.symbols
          grep -q ' _main$' out/TinyGuestTV.symbols

      - name: Patch and verify UIKitGuestTV as MH_DYLIB
        working-directory: tvOS/ProbeMVP0
        run: |
          GUEST='build-uikit-guest/Build/Products/Release-appletvos/UIKitGuestTV.app/UIKitGuestTV'
          cp "$GUEST" out/UIKitGuestTV.original
          cp "$GUEST" out/UIKitGuestTV.patched
          echo '--- UIKitGuestTV before ---'
          otool -hv out/UIKitGuestTV.original
          ./build-tools/lctv_macho_patch out/UIKitGuestTV.patched
          echo '--- UIKitGuestTV after ---'
          otool -hv out/UIKitGuestTV.patched
          otool -l out/UIKitGuestTV.patched | sed -n '1,180p'
          python3 Tools/verify_macho.py out/UIKitGuestTV.patched
          echo '--- UIKit guest exported symbols ---'
          nm -gU out/UIKitGuestTV.patched | tee out/UIKitGuestTV.symbols
          grep -q '_LCTVUIKitGuestMarker' out/UIKitGuestTV.symbols
          grep -q ' _main$' out/UIKitGuestTV.symbols
          echo '--- UIKit dependencies ---'
          otool -L out/UIKitGuestTV.patched | tee out/UIKitGuestTV.dependencies
          grep -q 'UIKit.framework/UIKit' out/UIKitGuestTV.dependencies

      - name: Embed patched guests
        working-directory: tvOS/ProbeMVP0
        run: |
          APP='build/Build/Products/Release-appletvos/LiveContainerTV.app'

          TINY="$APP/Frameworks/TinyGuestTV.framework"
          mkdir -p "$TINY"
          cp out/TinyGuestTV.patched "$TINY/TinyGuestTV"
          cp TinyGuestTV/FrameworkInfo.plist "$TINY/Info.plist"
          chmod 755 "$TINY/TinyGuestTV"

          UIKIT="$APP/Frameworks/UIKitGuestTV.framework"
          mkdir -p "$UIKIT"
          cp out/UIKitGuestTV.patched "$UIKIT/UIKitGuestTV"
          cp UIKitGuestTV/FrameworkInfo.plist "$UIKIT/Info.plist"
          chmod 755 "$UIKIT/UIKitGuestTV"

          test -f "$TINY/TinyGuestTV"
          test -f "$UIKIT/UIKitGuestTV"
          file "$TINY/TinyGuestTV"
          file "$UIKIT/UIKitGuestTV"
          otool -hv "$TINY/TinyGuestTV"
          otool -hv "$UIKIT/UIKitGuestTV"
          /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$TINY/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$UIKIT/Info.plist"

      - name: Package host IPA
        working-directory: tvOS/ProbeMVP0
        run: |
          APP='build/Build/Products/Release-appletvos/LiveContainerTV.app'
          rm -rf out/Payload
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry LiveContainerTV-Prototype.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LiveContainerTV-Prototype
          path: |
            tvOS/ProbeMVP0/out/LiveContainerTV-Prototype.ipa
            tvOS/ProbeMVP0/out/TinyGuestTV.original
            tvOS/ProbeMVP0/out/TinyGuestTV.patched
            tvOS/ProbeMVP0/out/TinyGuestTV.symbols
            tvOS/ProbeMVP0/out/UIKitGuestTV.original
            tvOS/ProbeMVP0/out/UIKitGuestTV.patched
            tvOS/ProbeMVP0/out/UIKitGuestTV.symbols
            tvOS/ProbeMVP0/out/UIKitGuestTV.dependencies
            tvOS/ProbeMVP0/xcodebuild.log
            tvOS/ProbeMVP0/xcodebuild-guest.log
            tvOS/ProbeMVP0/xcodebuild-uikit-guest.log
