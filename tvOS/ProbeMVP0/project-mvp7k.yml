name: LiveContainerTVMVP7K
options:
  bundleIdPrefix: dev.livecontainertv
  deploymentTarget:
    tvOS: "15.0"
settings:
  base:
    CLANG_ENABLE_MODULES: YES
    ENABLE_BITCODE: NO
    ONLY_ACTIVE_ARCH: NO
    ARCHS: arm64
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  LiveContainerTVMVP7K:
    type: application
    platform: tvOS
    deploymentTarget: "15.0"
    sources:
      - path: AppHost/GuestRuntime.m
      - path: AppHost/MVP7HMain.m
      - path: AppHost/MVP7KProbe.m
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.livecontainertv.probe
        PRODUCT_NAME: LiveContainerTV
        INFOPLIST_FILE: AppHost/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SUPPORTS_MACCATALYST: NO
        DEAD_CODE_STRIPPING: NO
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
