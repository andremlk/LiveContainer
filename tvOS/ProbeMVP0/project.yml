        PRODUCT_BUNDLE_IDENTIFIER: dev.livecontainertv.probe
        PRODUCT_NAME: LiveContainerTV
        INFOPLIST_FILE: AppHost/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SUPPORTS_MACCATALYST: NO

  LiveContainerTVMVP7C:
    type: application
    platform: tvOS
