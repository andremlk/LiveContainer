name: LiveContainerTV
options:
  bundleIdPrefix: dev.livecontainertv
  deploymentTarget:
    tvOS: "15.0"
settings:
  base:
    CLANG_ENABLE_MODULES: YES
    ENABLE_BITCODE: NO
    ONLY_ACTIVE_ARCH: NO
    ARCHS: arm64
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  GuestPayload:
    type: framework
    platform: tvOS
    deploymentTarget: "15.0"
    sources:
      - path: GuestPayload
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.livecontainertv.GuestPayload
        PRODUCT_NAME: GuestPayload
        MACH_O_TYPE: mh_dylib
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        LD_DYLIB_INSTALL_NAME: "@rpath/GuestPayload.framework/GuestPayload"
        GCC_SYMBOLS_PRIVATE_EXTERN: NO

  LiveContainerTV:
    type: application
    platform: tvOS
    deploymentTarget: "15.0"
    sources:
      - path: AppHost
    dependencies:
      - target: GuestPayload
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.livecontainertv.probe
        PRODUCT_NAME: LiveContainerTV
        INFOPLIST_FILE: AppHost/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SUPPORTS_MACCATALYST: NO
