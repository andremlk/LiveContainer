name: IPAToolTV
options:
  bundleIdPrefix: dev.andre
  deploymentTarget:
    tvOS: "17.0"

packages:
  ApplePackage:
    path: Vendor/ApplePackage

targets:
  IPAToolTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    dependencies:
      - package: ApplePackage
        product: ApplePackage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.andre.ipatooltv.mvp1
        PRODUCT_NAME: IPAToolTV
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "IPATool TV"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 3
